<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 360" width="420" height="360" fill="none">
  <defs>
    <!-- Filtros de Sombra Suave y Relieve -->
    <filter id="serv-ambient-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.14" />
    </filter>

    <!-- Gradientes de Suelo & Estratificación -->
    <linearGradient id="serv-top-pavement" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9" />
      <stop offset="60%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <!-- Gradientes de Tubería de Agua Potable Azul -->
    <linearGradient id="serv-pipe-blue-top" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd" />
      <stop offset="35%" stop-color="#3b82f6" />
      <stop offset="85%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
    <linearGradient id="serv-pipe-blue-front" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#1e40af" />
    </linearGradient>

    <!-- Gradientes de Ducto Eléctrico y Fibra Óptica Naranja -->
    <linearGradient id="serv-pipe-orange" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa" />
      <stop offset="35%" stop-color="#f97316" />
      <stop offset="85%" stop-color="#c2410c" />
      <stop offset="100%" stop-color="#7c2d12" />
    </linearGradient>

    <!-- Gradientes de Tubería de Alcantarillado Gris / Hormigón -->
    <linearGradient id="serv-pipe-gray" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="35%" stop-color="#64748b" />
      <stop offset="85%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Gradientes de Tierra y Zanja Técnica -->
    <linearGradient id="serv-trench-wall" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3f2314" />
      <stop offset="100%" stop-color="#5a331c" />
    </linearGradient>
    <linearGradient id="serv-gravel-bed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d6d3d1" />
      <stop offset="50%" stop-color="#a8a29e" />
      <stop offset="100%" stop-color="#78716c" />
    </linearGradient>
    <linearGradient id="serv-soil-strata-left" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#78350f" />
      <stop offset="50%" stop-color="#92400e" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>
    <linearGradient id="serv-soil-strata-right" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#451a03" />
      <stop offset="50%" stop-color="#78350f" />
      <stop offset="100%" stop-color="#291202" />
    </linearGradient>
  </defs>

  <!-- Sombra Suave Proyectada en el Suelo -->
  <ellipse cx="210" cy="305" rx="160" ry="42" fill="#0f172a" opacity="0.16" />

  <!-- ================= CARAS LATERALES DE SUELO ESTRATIFICADO ================= -->
  <!-- CARA LATERAL IZQUIERDA -->
  <g>
    <!-- Capa 1: Pavimento y Cama de Asiento -->
    <path d="M 50 170 L 140 222 L 140 236 L 50 184 Z" fill="#64748b" />
    <!-- Capa 2: Suelo de Relleno Compactado -->
    <path d="M 50 184 L 140 236 L 140 262 L 50 210 Z" fill="url(#serv-soil-strata-left)" />
    <!-- Capa 3: Subsuelo Inalterado -->
    <path d="M 50 210 L 140 262 L 140 310 L 50 258 Z" fill="#451a03" />
    <!-- Líneas de Estrato Geotécnico -->
    <path d="M 50 184 L 140 236" stroke="#94a3b8" stroke-width="0.8" stroke-opacity="0.5" />
    <path d="M 50 210 L 140 262" stroke="#291202" stroke-width="1" stroke-opacity="0.6" />
    <circle cx="85" cy="225" r="2.2" fill="#d97706" opacity="0.4" />
    <circle cx="110" cy="255" r="1.8" fill="#f59e0b" opacity="0.3" />
  </g>

  <!-- CARA LATERAL DERECHA (Pared Completa del Bloque) -->
  <g>
    <path d="M 290 216 L 370 170 L 370 238 L 290 284 Z" fill="url(#serv-soil-strata-right)" />
    <path d="M 290 284 L 370 238 L 370 258 L 290 304 Z" fill="#291202" />
    <!-- Líneas de Estrato Derecha -->
    <path d="M 290 236 L 370 190" stroke="#78350f" stroke-width="1" stroke-opacity="0.5" />
    <path d="M 290 260 L 370 214" stroke="#451a03" stroke-width="1" stroke-opacity="0.6" />
    <circle cx="330" cy="225" r="2.5" fill="#78350f" opacity="0.5" />
    <circle cx="345" cy="245" r="2" fill="#581c87" opacity="0.3" />
  </g>

  <!-- ================= SUPERFICIE SUPERIOR (PAVIMENTO URBANO CON REGISTRO) ================= -->
  <g filter="url(#serv-ambient-shadow)">
    <!-- Plataforma Superior Parcial (con zanja abierta en primer plano) -->
    <!-- Sección Posterior del Pavimento -->
    <polygon points="50,170 210,78 370,170 290,216 190,158 140,187 85,155" fill="url(#serv-top-pavement)" />

    <!-- Retícula de Adoquines de la Superficie Superior -->
    <g stroke="#94a3b8" stroke-width="0.75" stroke-opacity="0.45">
      <line x1="85" y1="150" x2="235" y2="64" />
      <line x1="120" y1="130" x2="270" y2="44" />
      <line x1="155" y1="150" x2="295" y2="70" />
      <line x1="180" y1="135" x2="330" y2="221" />
    </g>

    <!-- Tapa de Registro Sanitario de Hierro Dúctil (Manhole Cover Isométrica) -->
    <g>
      <!-- Base exterior del marco metálico -->
      <polygon points="215,125 245,108 275,125 245,142" fill="#334155" stroke="#475569" stroke-width="1.2" />
      <!-- Disco Interior de la Tapa -->
      <polygon points="220,125 245,111 270,125 245,139" fill="#1e293b" />
      <!-- Anillos y Nervios Antideslizantes Isométricos -->
      <polygon points="227,125 245,115 263,125 245,135" fill="none" stroke="#64748b" stroke-width="0.9" />
      <!-- Ranuras de Izaje -->
      <line x1="240" y1="125" x2="250" y2="125" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" />
      <!-- Logo o Siglas "MGM URB" grabado -->
      <circle cx="245" cy="125" r="1.5" fill="#f8fafc" />
    </g>
  </g>

  <!-- ================= ZANJA TÉCNICA SUBTERRÁNEA (CORTE TRANSVERSAL) ================= -->
  <!-- Pared Posterior de la Zanja Excavada -->
  <polygon points="140,187 190,158 290,216 240,245" fill="url(#serv-trench-wall)" />
  <!-- Paredes Laterales Internas de la Excavación -->
  <polygon points="140,187 140,250 180,273 180,210" fill="#361b0c" />
  <polygon points="290,216 290,279 250,302 250,239" fill="#241005" />

  <!-- Fondo de la Zanja con Cama de Grava / Arena de Apoyo -->
  <polygon points="140,250 180,273 280,215 240,192" fill="url(#serv-gravel-bed)" />
  <!-- Textura de Piedra Triturada en el Fondo -->
  <g fill="#78716c" opacity="0.6">
    <circle cx="160" cy="255" r="2.5" />
    <circle cx="175" cy="265" r="2" />
    <circle cx="195" cy="245" r="3" />
    <circle cx="215" cy="235" r="2" />
    <circle cx="230" cy="225" r="2.5" />
    <circle cx="245" cy="215" r="1.8" />
  </g>

  <!-- ================= REDES SOTERRADAS (TUBERÍAS Y DUCTOS 3D) ================= -->

  <!-- 1. Gran Tubería Matriz de Alcantarillado / Aguas Pluviales (Gris Hormigón / PVC Sanitario) -->
  <g>
    <!-- Sombra propia de la tubería grande en el lecho -->
    <path d="M 155 268 L 255 210 L 265 216 L 165 274 Z" fill="#1c1917" opacity="0.4" />

    <!-- Tubo Principal Cilíndrico Isométrico (diámetro 32px) -->
    <!-- Cuerpo del Tubo -->
    <path d="M 160 262 L 260 204 L 260 224 L 160 282 Z" fill="url(#serv-pipe-gray)" />
    <!-- Cara Frontal / Sección Transversal Abierta del Tubo (Boca del Colector) -->
    <ellipse cx="160" cy="272" rx="14" ry="10" fill="#0f172a" stroke="#475569" stroke-width="2.5" />
    <!-- Interior Hueco de la Tubería Pluvial -->
    <ellipse cx="160" cy="272" rx="10" ry="7" fill="#020617" />
    <!-- Flujo de Agua Sutil en la Base del Tubo -->
    <path d="M 153 275 Q 160 279 167 275 Q 160 277 153 275 Z" fill="#38bdf8" opacity="0.7" />

    <!-- Brida / Campana de Unión de la Tubería -->
    <path d="M 205 236 L 210 233 L 210 253 L 205 256 Z" fill="#94a3b8" />
  </g>

  <!-- 2. Tubería Presurizada de Agua Potable (Azul HDPE Norma Técnica) -->
  <g>
    <!-- Sombra de la tubería azul -->
    <path d="M 148 244 L 248 186 L 254 190 L 154 248 Z" fill="#1c1917" opacity="0.3" />

    <!-- Cuerpo Cilíndrico Azul de la Tubería -->
    <path d="M 150 238 L 250 180 L 250 196 L 150 254 Z" fill="url(#serv-pipe-blue-top)" />

    <!-- Línea de Reflejo Especular Superior 3D (Brillo de Plástico HDPE) -->
    <line x1="151" y1="240" x2="249" y2="182" stroke="#bfdbfe" stroke-width="2" stroke-linecap="round" stroke-opacity="0.9" />

    <!-- Boca Frontal Abierta de la Tubería Azul -->
    <ellipse cx="150" cy="246" rx="9" ry="8" fill="url(#serv-pipe-blue-front)" stroke="#1d4ed8" stroke-width="1.8" />
    <!-- Centro Hueco de Agua -->
    <ellipse cx="150" cy="246" rx="6" ry="5" fill="#1e3a8a" />
    <ellipse cx="150" cy="246" rx="4" ry="3.5" fill="#60a5fa" opacity="0.6" />

    <!-- Válvula / Acople de Fundición Dúctil con Tornillería -->
    <g>
      <path d="M 195 212 L 201 208 L 201 224 L 195 228 Z" fill="#1e40af" stroke="#3b82f6" stroke-width="0.8" />
      <!-- Volante de Válvula de Maniobra -->
      <ellipse cx="198" cy="204" rx="6" ry="3" fill="#ef4444" stroke="#b91c1c" stroke-width="0.8" />
      <line x1="198" y1="204" x2="198" y2="210" stroke="#94a3b8" stroke-width="1.5" />
    </g>
  </g>

  <!-- 3. Banco de Ductos Subterráneos Eléctricos y Fibra Óptica (Naranja) -->
  <g>
    <!-- Ducto 1 (Superior) -->
    <path d="M 172 216 L 272 158 L 272 168 L 172 226 Z" fill="url(#serv-pipe-orange)" />
    <line x1="173" y1="217" x2="271" y2="159" stroke="#ffedd5" stroke-width="1.2" stroke-linecap="round" />
    <ellipse cx="172" cy="221" rx="6" ry="5" fill="#ea580c" stroke="#c2410c" stroke-width="1.2" />
    <ellipse cx="172" cy="221" rx="3.5" ry="3" fill="#431407" />

    <!-- Ducto 2 (Inferior / Paralelo) -->
    <path d="M 184 223 L 284 165 L 284 175 L 184 233 Z" fill="url(#serv-pipe-orange)" />
    <line x1="185" y1="224" x2="283" y2="166" stroke="#ffedd5" stroke-width="1.2" stroke-linecap="round" />
    <ellipse cx="184" cy="228" rx="6" ry="5" fill="#ea580c" stroke="#c2410c" stroke-width="1.2" />
    <ellipse cx="184" cy="228" rx="3.5" ry="3" fill="#431407" />

    <!-- Separador / Peine de Ductería (Duct Spacer) -->
    <polygon points="220,188 226,184 226,204 220,208" fill="#1e293b" />
  </g>

  <!-- 4. Cinta Señalizadora de Advertencia Subterránea (Amarilla Flotante) -->
  <g>
    <path d="M 160 195 Q 210 162 260 138" fill="none" stroke="#facc15" stroke-width="4" stroke-linecap="square" />
    <!-- Textos o Franjas de Precaución Negras en la Cinta -->
    <path d="M 160 195 Q 210 162 260 138" fill="none" stroke="#000000" stroke-width="4" stroke-dasharray="5 7" />
  </g>

  <!-- Corte Frontal de Cierre de la Zanja (Tierra con Relleno Seleccionado) -->
  <g>
    <path d="M 140 236 L 210 276 L 210 310 L 140 270 Z" fill="#5c2e0b" />
    <path d="M 210 276 L 290 230 L 290 264 L 210 310 Z" fill="#3b1b08" />
  </g>
</svg>
