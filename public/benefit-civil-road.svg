<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 360" width="420" height="360" fill="none">
  <defs>
    <!-- Filtro de Sombra Suave -->
    <filter id="road-ambient-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.14" />
    </filter>
    <filter id="road-lamp-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur" />
    </filter>

    <!-- Gradientes de Suelo & Estratificación -->
    <linearGradient id="road-top-surface" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="60%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>

    <linearGradient id="road-curb-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>

    <linearGradient id="road-sidewalk" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <linearGradient id="road-soil-left-1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="road-soil-left-2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#92400e" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
    <linearGradient id="road-soil-left-3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#9a3412" />
    </linearGradient>

    <linearGradient id="road-soil-right-1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="road-soil-right-2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#78350f" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>
    <linearGradient id="road-soil-right-3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9a3412" />
      <stop offset="100%" stop-color="#581c87" />
    </linearGradient>

    <!-- Gradientes de Luminaria -->
    <linearGradient id="road-pole-metal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#64748b" />
      <stop offset="50%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="road-lamp-light" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#eab308" stop-opacity="0.2" />
    </linearGradient>

    <!-- Gradientes Árbol Ornamental -->
    <linearGradient id="road-tree-trunk" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#78350f" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>
    <linearGradient id="road-tree-canopy-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="100%" stop-color="#16a34a" />
    </linearGradient>
    <linearGradient id="road-tree-canopy-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>
  </defs>

  <!-- Sombra Suave Proyectada en el Piso -->
  <ellipse cx="210" cy="305" rx="160" ry="42" fill="#0f172a" opacity="0.16" />

  <!-- ================= BLOQUE ISOMÉTRICO (SUSTRATO Y TIERRA) ================= -->
  <!-- CARA LATERAL IZQUIERDA (Corte Geotécnico / Subrasante) -->
  <g>
    <!-- Capa 1: Hormigón de Base / Rasante Vial -->
    <path d="M 50 170 L 210 262 L 210 274 L 50 182 Z" fill="url(#road-soil-left-1)" />
    <!-- Capa 2: Base Granular Triturada Compuesta -->
    <path d="M 50 182 L 210 274 L 210 292 L 50 200 Z" fill="url(#road-soil-left-2)" />
    <!-- Capa 3: Subrasante y Suelo Natural Estratificado -->
    <path d="M 50 200 L 210 292 L 210 310 L 50 218 Z" fill="url(#road-soil-left-3)" />

    <!-- Líneas de Estratificación Técnica Izquierda -->
    <path d="M 50 182 L 210 274" stroke="#64748b" stroke-width="1" stroke-opacity="0.4" />
    <path d="M 50 200 L 210 292" stroke="#451a03" stroke-width="1" stroke-opacity="0.5" />
    <!-- Textura Geotécnica sutil -->
    <circle cx="95" cy="225" r="2" fill="#d97706" opacity="0.4" />
    <circle cx="140" cy="250" r="1.5" fill="#f59e0b" opacity="0.3" />
    <circle cx="175" cy="272" r="2" fill="#b45309" opacity="0.4" />
  </g>

  <!-- CARA LATERAL DERECHA (Corte de Acera y Cimiento) -->
  <g>
    <!-- Capa 1: Hormigón de Acera / Encintado -->
    <path d="M 210 262 L 370 170 L 370 182 L 210 274 Z" fill="url(#road-soil-right-1)" />
    <!-- Capa 2: Capa Portante y Cimiento de Bordillo -->
    <path d="M 210 274 L 370 182 L 370 200 L 210 292 Z" fill="url(#road-soil-right-2)" />
    <!-- Capa 3: Suelo Firme de Desplante -->
    <path d="M 210 292 L 370 200 L 370 218 L 210 310 Z" fill="#3b1b08" />

    <!-- Líneas de Estratificación Técnica Derecha -->
    <path d="M 210 274 L 370 182" stroke="#1e293b" stroke-width="1" stroke-opacity="0.6" />
    <path d="M 210 292 L 370 200" stroke="#1e293b" stroke-width="1" stroke-opacity="0.6" />
    <!-- Textura piedras / áridos de base -->
    <circle cx="250" cy="268" r="2" fill="#78350f" opacity="0.5" />
    <circle cx="300" cy="238" r="2.5" fill="#92400e" opacity="0.4" />
    <circle cx="340" cy="210" r="1.8" fill="#78350f" opacity="0.5" />
  </g>

  <!-- ================= PLANTA SUPERIOR ISOMÉTRICA (CALZADA Y ACERA) ================= -->
  <!-- 1. Calzada Principal de Adoquín -->
  <g filter="url(#road-ambient-shadow)">
    <!-- Base de la Calzada -->
    <path d="M 50 170 L 210 78 L 305 132 L 145 224 Z" fill="url(#road-top-surface)" />

    <!-- Trama de Adoquines Isométricos (Líneas de juntas vectoriales con precisión de 30°) -->
    <g stroke="#475569" stroke-width="0.85" stroke-opacity="0.45" stroke-linecap="round">
      <!-- Líneas de juntas en eje X isométrico -->
      <line x1="70" y1="158" x2="225" y2="70" />
      <line x1="90" y1="170" x2="245" y2="82" />
      <line x1="110" y1="181" x2="265" y2="94" />
      <line x1="130" y1="193" x2="285" y2="105" />

      <!-- Líneas de juntas en eje Y isométrico -->
      <line x1="100" y1="114" x2="72" y2="130" />
      <line x1="130" y1="97" x2="92" y2="119" />
      <line x1="160" y1="80" x2="112" y2="108" />
      <line x1="150" y1="143" x2="112" y2="165" />
      <line x1="180" y1="126" x2="132" y2="154" />
      <line x1="210" y1="108" x2="152" y2="142" />
      <line x1="190" y1="172" x2="152" y2="194" />
      <line x1="220" y1="155" x2="172" y2="183" />
      <line x1="250" y1="137" x2="192" y2="171" />
    </g>

    <!-- Demarcación Vial Central (Línea discontinua reflectiva blanca) -->
    <g stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.95">
      <line x1="85" y1="185" x2="115" y2="168" />
      <line x1="140" y1="153" x2="170" y2="136" />
      <line x1="195" y1="122" x2="225" y2="105" />
      <line x1="250" y1="91" x2="275" y2="76" />
    </g>

    <!-- Cuneta y Sumidero de Aguas Lluvias (Rejilla de drenaje pluvial en el borde de calzada) -->
    <g>
      <!-- Canal de desagüe -->
      <polygon points="135,218 145,224 295,138 285,132" fill="#334155" />
      <!-- Rejilla metálica de sumidero pluvial -->
      <polygon points="180,188 195,197 225,180 210,171" fill="#1e293b" stroke="#475569" stroke-width="0.8" />
      <!-- Ranuras de la rejilla -->
      <line x1="185" y1="188" x2="192" y2="192" stroke="#94a3b8" stroke-width="1.2" />
      <line x1="193" y1="184" x2="200" y2="188" stroke="#94a3b8" stroke-width="1.2" />
      <line x1="201" y1="179" x2="208" y2="183" stroke="#94a3b8" stroke-width="1.2" />
    </g>

    <!-- Bordillo de Hormigón Armado (Curb) Elevado 3D -->
    <g>
      <!-- Frente del bordillo -->
      <polygon points="145,224 210,262 210,257 145,219" fill="#94a3b8" />
      <!-- Tapa superior biselada del bordillo -->
      <polygon points="145,219 210,257 370,165 305,127" fill="url(#road-curb-top)" />
    </g>

    <!-- Acera Peatonal Elevada (Sidewalk) con Adoquines Cuadrados -->
    <g>
      <!-- Superficie de Acera -->
      <polygon points="152,215 210,248 370,156 312,123" fill="url(#road-sidewalk)" />
      <!-- Juntas de acera en retícula -->
      <g stroke="#94a3b8" stroke-width="0.75" stroke-opacity="0.6">
        <line x1="180" y1="198" x2="330" y2="112" />
        <line x1="210" y1="181" x2="350" y2="100" />
        <line x1="225" y1="215" x2="255" y2="232" />
        <line x1="255" y1="198" x2="285" y2="215" />
        <line x1="285" y1="181" x2="315" y2="198" />
        <line x1="315" y1="163" x2="345" y2="180" />
      </g>
    </g>
  </g>

  <!-- ================= ELEMENTOS SOBRE LA ACERA: POSTE & ÁRBOL ================= -->
  <!-- Alcorque del Árbol en Acera -->
  <g>
    <polygon points="275,200 295,212 315,200 295,188" fill="#451a03" stroke="#78350f" stroke-width="1" />
    <!-- Tierra vegetal interior -->
    <polygon points="278,200 295,210 312,200 295,190" fill="#291202" />
  </g>

  <!-- Árbol Ornamental Isométrico -->
  <g>
    <!-- Sombra del árbol en la acera -->
    <ellipse cx="295" cy="204" rx="22" ry="10" fill="#0f172a" opacity="0.3" />

    <!-- Tronco del Árbol -->
    <path d="M 293 202 L 297 202 L 296 155 L 294 155 Z" fill="url(#road-tree-trunk)" />
    <!-- Ramificación -->
    <path d="M 294 165 L 285 150 M 296 160 L 306 148" stroke="#58240c" stroke-width="2.5" stroke-linecap="round" />

    <!-- Copa del Árbol Geométrica Multi-capa -->
    <!-- Capa de Sombra Inferior -->
    <circle cx="295" cy="142" r="28" fill="#14532d" />
    <circle cx="282" cy="148" r="18" fill="#166534" />
    <circle cx="310" cy="146" r="18" fill="#15803d" />

    <!-- Capa Media Volumen -->
    <circle cx="295" cy="136" r="24" fill="url(#road-tree-canopy-2)" />
    <circle cx="282" cy="138" r="16" fill="#22c55e" />
    <circle cx="308" cy="136" r="16" fill="url(#road-tree-canopy-1)" />

    <!-- Capa de Iluminación Superior (Sol cenital matutino) -->
    <circle cx="292" cy="128" r="18" fill="url(#road-tree-canopy-1)" />
    <ellipse cx="288" cy="124" rx="10" ry="7" fill="#86efac" opacity="0.8" />
  </g>

  <!-- Poste de Alumbrado Público Moderno Doble Luminaria LED -->
  <g>
    <!-- Base / Anclaje Metálico en Acera con Pernos -->
    <polygon points="230,225 240,231 248,226 238,220" fill="#334155" stroke="#64748b" stroke-width="0.8" />
    <circle cx="239" cy="226" r="1.5" fill="#f8fafc" />

    <!-- Poste Vertical Metálico Tubular -->
    <path d="M 238 225 L 238 75 L 241 75 L 241 225 Z" fill="url(#road-pole-metal)" />

    <!-- Anillo Decorativo / Caja de Registro -->
    <rect x="237" y="205" width="5" height="8" rx="1" fill="#1e293b" />

    <!-- Brazo 1: Hacia la Calzada Izquierda (Luminaria Principal) -->
    <path d="M 239 85 C 239 70, 215 62, 195 68" fill="none" stroke="url(#road-pole-metal)" stroke-width="3" stroke-linecap="round" />
    <!-- Cabeza LED Izquierda -->
    <g>
      <!-- Carcasa luminaria -->
      <polygon points="186,67 200,63 204,69 190,73" fill="#1e293b" stroke="#475569" stroke-width="0.8" />
      <!-- Pantalla LED Encendida -->
      <polygon points="188,71 202,67 200,70 186,74" fill="#fef08a" />
      <!-- Cono de Luz Suave hacia la Calzada -->
      <polygon points="193,73 130,175 220,135" fill="url(#road-lamp-light)" opacity="0.35" style="mix-blend-mode: screen;" />
    </g>

    <!-- Brazo 2: Hacia la Acera Derecha (Luminaria Peatonal) -->
    <path d="M 239 98 C 245 90, 260 88, 272 94" fill="none" stroke="url(#road-pole-metal)" stroke-width="2.2" stroke-linecap="round" />
    <!-- Cabeza LED Derecha -->
    <g>
      <polygon points="270,93 280,90 283,95 273,98" fill="#1e293b" stroke="#475569" stroke-width="0.8" />
      <polygon points="271,96 281,93 280,95 270,98" fill="#fef08a" />
    </g>

    <!-- Cúspide del Poste -->
    <path d="M 237 75 L 239.5 68 L 242 75 Z" fill="#94a3b8" />
  </g>
</svg>
