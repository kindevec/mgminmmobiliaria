<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 360" width="420" height="360" fill="none">
  <defs>
    <!-- Filtros de Sombra Suave -->
    <filter id="park-ambient-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.14" />
    </filter>

    <!-- Gradientes de Césped y Parque -->
    <linearGradient id="park-lawn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#86efac" />
      <stop offset="40%" stop-color="#4ade80" />
      <stop offset="75%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>

    <!-- Gradiente de la Caminería Ecológica -->
    <linearGradient id="park-trail" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="60%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>

    <!-- Gradientes de Tierra Fértil y Estratificación -->
    <linearGradient id="park-soil-left-1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#14532d" />
      <stop offset="30%" stop-color="#3f2314" />
      <stop offset="100%" stop-color="#291202" />
    </linearGradient>
    <linearGradient id="park-soil-left-2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#78350f" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>

    <linearGradient id="park-soil-right" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#166534" />
      <stop offset="25%" stop-color="#291202" />
      <stop offset="70%" stop-color="#451a03" />
      <stop offset="100%" stop-color="#1c0b02" />
    </linearGradient>

    <!-- Gradientes de Vegetación -->
    <linearGradient id="park-pine-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="100%" stop-color="#16a34a" />
    </linearGradient>
    <linearGradient id="park-pine-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15803d" />
      <stop offset="100%" stop-color="#052e16" />
    </linearGradient>
  </defs>

  <!-- Sombra Suave Proyectada en el Piso -->
  <ellipse cx="210" cy="305" rx="160" ry="42" fill="#0f172a" opacity="0.16" />

  <!-- ================= BLOQUE ISOMÉTRICO (SUELO Y TIERRA VEGETAL) ================= -->
  <!-- CARA LATERAL IZQUIERDA -->
  <g>
    <!-- Capa 1: Capa de Humus Orgánico y Raíces -->
    <path d="M 50 170 L 210 262 L 210 280 L 50 188 Z" fill="url(#park-soil-left-1)" />
    <!-- Capa 2: Estrato de Tierra Arcillosa y Grava -->
    <path d="M 50 188 L 210 280 L 210 310 L 50 218 Z" fill="url(#park-soil-left-2)" />
    <!-- Líneas de Separación Geológica -->
    <path d="M 50 188 L 210 280" stroke="#16a34a" stroke-width="1" stroke-opacity="0.4" />
    <path d="M 50 202 L 210 294" stroke="#78350f" stroke-width="0.8" stroke-opacity="0.5" />
    <!-- Piedras en el sustrato -->
    <circle cx="105" cy="235" r="2.5" fill="#a8a29e" opacity="0.4" />
    <circle cx="155" cy="265" r="2" fill="#78716c" opacity="0.4" />
  </g>

  <!-- CARA LATERAL DERECHA -->
  <g>
    <path d="M 210 262 L 370 170 L 370 218 L 210 310 Z" fill="url(#park-soil-right)" />
    <!-- Líneas de Separación Derecha -->
    <path d="M 210 280 L 370 188" stroke="#14532d" stroke-width="1" stroke-opacity="0.4" />
    <path d="M 210 294 L 370 202" stroke="#291202" stroke-width="0.8" stroke-opacity="0.6" />
    <circle cx="280" cy="270" r="2.2" fill="#57534e" opacity="0.4" />
    <circle cx="330" cy="230" r="1.8" fill="#78716c" opacity="0.4" />
  </g>

  <!-- ================= CUBIERTA SUPERIOR: CÉSPED Y PAISAJISMO ================= -->
  <g filter="url(#park-ambient-shadow)">
    <!-- Base de Césped Principal -->
    <path d="M 50 170 L 210 78 L 370 170 L 210 262 Z" fill="url(#park-lawn)" />

    <!-- Textura Sutil de Pradera (Lotes de micro-relieve) -->
    <path d="M 80 152 Q 130 130 190 145 T 300 115" stroke="#bbf7d0" stroke-width="1" stroke-opacity="0.4" fill="none" />
    <path d="M 120 185 Q 180 160 250 180 T 340 145" stroke="#15803d" stroke-width="1" stroke-opacity="0.3" fill="none" />

    <!-- Caminería Ecológica Sinuosa (Sendero Peatonal en 'S') -->
    <g>
      <!-- Borde de Piedra del Sendero -->
      <path d="M 70 182 C 120 195, 150 160, 200 185 C 250 210, 290 170, 350 182" fill="none" stroke="#ca8a04" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />
      <!-- Superficie de Arena / Granza Compactada -->
      <path d="M 70 182 C 120 195, 150 160, 200 185 C 250 210, 290 170, 350 182" fill="none" stroke="url(#park-trail)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
      <!-- Destellos de piedra y pisadas -->
      <path d="M 70 182 C 120 195, 150 160, 200 185 C 250 210, 290 170, 350 182" fill="none" stroke="#fef9c3" stroke-width="2" stroke-dasharray="4 8" stroke-linecap="round" />
    </g>

    <!-- Banco de Parque de Madera y Acero junto al Sendero -->
    <g>
      <!-- Sombra del Banco -->
      <ellipse cx="230" cy="182" rx="14" ry="5" fill="#0f172a" opacity="0.25" />
      <!-- Asiento y Respaldo Isométrico -->
      <polygon points="220,175 235,167 245,173 230,181" fill="#78350f" stroke="#451a03" stroke-width="0.8" />
      <polygon points="220,172 235,164 235,167 220,175" fill="#b45309" />
      <!-- Patas metálicas -->
      <line x1="222" y1="180" x2="222" y2="183" stroke="#1e293b" stroke-width="1.5" />
      <line x1="242" y1="172" x2="242" y2="175" stroke="#1e293b" stroke-width="1.5" />
    </g>

    <!-- Pequeñas Rocas Ornamentales junto a la Caminería -->
    <g>
      <ellipse cx="145" cy="172" rx="6" ry="4" fill="#64748b" />
      <ellipse cx="144" cy="170" rx="4" ry="2.5" fill="#94a3b8" />
      <ellipse cx="280" cy="195" rx="7" ry="4.5" fill="#475569" />
      <ellipse cx="279" cy="193" rx="5" ry="3" fill="#cbd5e1" />
    </g>
  </g>

  <!-- ================= VEGETACIÓN Y ARBOLADO ISOMÉTRICO 3D ================= -->

  <!-- 1. Pino / Conífera 1 (Fondo Izquierdo) -->
  <g>
    <!-- Sombra del pino -->
    <ellipse cx="135" cy="142" rx="18" ry="7" fill="#0f172a" opacity="0.3" />
    <!-- Tronco -->
    <rect x="133" y="125" width="4" height="18" fill="#451a03" rx="1" />

    <!-- Nivel Inferior de Ramas (Cono 1) -->
    <!-- Cara Iluminada (Izquierda) -->
    <polygon points="135,85 110,130 135,130" fill="url(#park-pine-light)" />
    <!-- Cara en Sombra (Derecha) -->
    <polygon points="135,85 135,130 160,130" fill="url(#park-pine-dark)" />

    <!-- Nivel Medio (Cono 2) -->
    <polygon points="135,70 115,110 135,110" fill="url(#park-pine-light)" />
    <polygon points="135,70 135,110 155,110" fill="url(#park-pine-dark)" />

    <!-- Nivel Superior / Cúspide (Cono 3) -->
    <polygon points="135,55 120,90 135,90" fill="#86efac" />
    <polygon points="135,55 135,90 150,90" fill="url(#park-pine-light)" />
  </g>

  <!-- 2. Pino / Conífera 2 (Fondo Central / Elevado) -->
  <g>
    <!-- Sombra -->
    <ellipse cx="210" cy="105" rx="15" ry="6" fill="#0f172a" opacity="0.3" />
    <rect x="208" y="92" width="3.5" height="15" fill="#451a03" rx="1" />

    <polygon points="210,60 188,100 210,100" fill="url(#park-pine-light)" />
    <polygon points="210,60 210,100 232,100" fill="url(#park-pine-dark)" />

    <polygon points="210,45 194,80 210,80" fill="#86efac" />
    <polygon points="210,45 210,80 226,80" fill="url(#park-pine-light)" />

    <polygon points="210,32 198,62 210,62" fill="#bbf7d0" />
    <polygon points="210,32 210,62 222,62" fill="#4ade80" />
  </g>

  <!-- 3. Gran Árbol Frondoso Deciduo (Canopia Orgánica Esférica - Primer Plano Derecho) -->
  <g>
    <!-- Sombra de la Copa Frondosa -->
    <ellipse cx="295" cy="155" rx="30" ry="12" fill="#0f172a" opacity="0.35" />
    <!-- Tronco Robusto y Ramificación -->
    <path d="M 292 153 L 297 153 L 296 110 L 293 110 Z" fill="#451a03" />
    <path d="M 294 125 L 282 110 M 295 120 L 308 108" stroke="#58240c" stroke-width="3" stroke-linecap="round" />

    <!-- Masas de Follaje Verde Brillante (Volumen 3D Multi-esfera) -->
    <!-- Base Sombra Profunda -->
    <circle cx="295" cy="98" r="32" fill="#052e16" />
    <circle cx="275" cy="105" r="22" fill="#14532d" />
    <circle cx="315" cy="102" r="22" fill="#166534" />

    <!-- Volumen Medio -->
    <circle cx="295" cy="90" r="28" fill="#15803d" />
    <circle cx="278" cy="95" r="20" fill="#22c55e" />
    <circle cx="312" cy="92" r="20" fill="url(#park-pine-light)" />

    <!-- Capa Superior Iluminada (Brillo Solar) -->
    <circle cx="290" cy="80" r="22" fill="url(#park-pine-light)" />
    <ellipse cx="285" cy="74" rx="14" ry="9" fill="#86efac" opacity="0.85" />
    <circle cx="308" cy="82" r="14" fill="#4ade80" />
  </g>

  <!-- 4. Arbustos y Macizos Florales en Primer Plano -->
  <g>
    <!-- Arbusto 1 (Izquierda Sendero) -->
    <ellipse cx="95" cy="178" rx="10" ry="5" fill="#0f172a" opacity="0.25" />
    <circle cx="95" cy="172" r="9" fill="#15803d" />
    <circle cx="93" cy="169" r="7" fill="#4ade80" />
    <circle cx="91" cy="167" r="4" fill="#bbf7d0" />
    <!-- Floración en flor de arbusto -->
    <circle cx="96" cy="169" r="1.5" fill="#f43f5e" />
    <circle cx="92" cy="171" r="1.5" fill="#fbbf24" />

    <!-- Arbusto 2 (Derecha Sendero) -->
    <ellipse cx="235" cy="225" rx="12" ry="6" fill="#0f172a" opacity="0.25" />
    <circle cx="235" cy="218" r="11" fill="#166534" />
    <circle cx="233" cy="214" r="9" fill="#22c55e" />
    <circle cx="231" cy="211" r="5" fill="#86efac" />
    <circle cx="236" cy="215" r="1.8" fill="#ec4899" />
  </g>
</svg>
